# Optional systemd drop-in for owner-authorized 4-book Demo cutover (Owner Decision 15, 2026-11-26).
# Switches deriv-sota-executor.service from --enforce-3book-cutover (3/3/3) to --enforce-4book-cutover (4/4/4)
# with dynamic rolling vintage loading/revocation for USDJPY.sota_roll14d_m60_up.v1 (Demo-only).
#
# Install ONLY after:
#   1. Separate owner approval for 4-book cutover and original 3-book cohort cutoff sealing;
#   2. Verified 127-day operational archive backfill + initial refit on vultr;
#   3. Clean drain, 4th-book cohort anchor registration, offline + live-smoke preflight.
#
# Explicitly resets ExecStartPre= and ExecStart= and pins the 4-book CLI flags directly
# (CLI flags override EnvironmentFile=, so ~/.config/binary-algo/deriv-sota-executor.env stays untouched
# at its 3-book 3/3/3 baseline and removing this drop-in atomically reverts to 3-book 3/3/3).
[Service]
ExecStartPre=
ExecStartPre=%h/binary-algo-venv/bin/python -B -E -s scripts/vps_preflight.py --offline-only --phase1-policy --require-explicit-book-ids --enforce-4book-cutover --account-mode ${DERIV_ACCOUNT_MODE} --book-ids USDJPY.sota_ens5_m30_up.v1,USDJPY.sota_stack05_m30_up.v1,USDJPY.sota_ens5_m15_up.v1,USDJPY.sota_roll14d_m60_up.v1 --rolling-vintage-dir deriv_data/runtime/rolling_vintages --stake ${DERIV_SOTA_STAKE} --max-stake-usd ${DERIV_SOTA_MAX_STAKE_USD} --max-daily-loss-usd ${DERIV_SOTA_MAX_DAILY_LOSS_USD} --max-drawdown-usd ${DERIV_SOTA_MAX_DRAWDOWN_USD} --max-open-contracts 4 --max-usd-factor-open 4 --max-jpy-factor-open 4 --absolute-breakeven-ceiling ${DERIV_SOTA_BREAKEVEN_CEILING} --ev-margin ${DERIV_SOTA_EV_MARGIN} --max-buy-dispatch-delay-s ${DERIV_SOTA_MAX_BUY_DISPATCH_DELAY_S} --queue-db ${DERIV_SOTA_QUEUE_DB} --log-dir ${DERIV_SOTA_LOG_DIR} --credential-isolation-receipt ${DERIV_SOTA_CREDENTIAL_ISOLATION_RECEIPT}
ExecStart=
ExecStart=%h/binary-algo-venv/bin/python -B -E -s scripts/deriv_sota_executor.py --run --phase1-policy --require-explicit-book-ids --enforce-4book-cutover --account-mode ${DERIV_ACCOUNT_MODE} --book-ids USDJPY.sota_ens5_m30_up.v1,USDJPY.sota_stack05_m30_up.v1,USDJPY.sota_ens5_m15_up.v1,USDJPY.sota_roll14d_m60_up.v1 --rolling-vintage-dir deriv_data/runtime/rolling_vintages --tick-feed-mode ${DERIV_SOTA_TICK_FEED_MODE} --tick-store-dir ${DERIV_SOTA_TICK_STORE_DIR} --stake ${DERIV_SOTA_STAKE} --max-stake-usd ${DERIV_SOTA_MAX_STAKE_USD} --max-daily-loss-usd ${DERIV_SOTA_MAX_DAILY_LOSS_USD} --max-drawdown-usd ${DERIV_SOTA_MAX_DRAWDOWN_USD} --max-open-contracts 4 --max-usd-factor-open 4 --max-jpy-factor-open 4 --absolute-breakeven-ceiling ${DERIV_SOTA_BREAKEVEN_CEILING} --ev-margin ${DERIV_SOTA_EV_MARGIN} --max-buy-dispatch-delay-s ${DERIV_SOTA_MAX_BUY_DISPATCH_DELAY_S} --queue-db ${DERIV_SOTA_QUEUE_DB} --log-dir ${DERIV_SOTA_LOG_DIR} --credential-isolation-receipt ${DERIV_SOTA_CREDENTIAL_ISOLATION_RECEIPT}
