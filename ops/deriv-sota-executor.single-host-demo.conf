# Optional systemd drop-in for owner-authorized Mode B ("single_host_units_masked", Demo VRTC* ONLY).
# Install ONLY when all 4 legacy user units are /dev/null-masked and verified inactive:
#   mkdir -p ~/.config/systemd/user/deriv-sota-executor.service.d
#   cp ~/git/binary-algo/ops/deriv-sota-executor.single-host-demo.conf \
#     ~/.config/systemd/user/deriv-sota-executor.service.d/10-single-host-demo.conf
#   systemctl --user daemon-reload
# Never install under Mode A ("revoked") or for any live (CR*) account.
[Service]
EnvironmentFile=
EnvironmentFile=%h/.config/binary-algo/deriv-demo-executor.env
EnvironmentFile=%h/.config/binary-algo/deriv-sota-executor.env
